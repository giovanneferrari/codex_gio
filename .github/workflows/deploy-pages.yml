name: Publicar no GitHub Pages

on:
  push:
    branches: [main, work]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Configurar o GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar os arquivos do site
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY || vars.GOOGLE_MAPS_API_KEY }}
        run: |
          python3 tools/sync_eventos.py
          mkdir -p _site
          cp index.html styles.css app.js commercial-diary.js commercial-diary.css workshop-admin.css workshop-admin.js public-order-admin.js event-financials.css event-financials.js event-share-spacing.css workflow-updates.js workflow-updates.css workshop.html workshop.css workshop-overrides.css workshop.js .nojekyll _site/
          printf "window.RITO_GOOGLE_MAPS_API_KEY='%s';\n" "$GOOGLE_MAPS_API_KEY" > _site/google-maps-config.js
          cp -R assets _site/assets
          cp -R rev2 _site/rev2
          cp -R workshop _site/workshop
          cp -R pedir _site/pedir
          cp -R teste _site/teste
          cp -R eventos _site/eventos
          cp -R eventos-proposta _site/eventos-proposta
          # V3 real compartilha o app atual; a demonstração fica em /v3/demo/.
          node --test tests/v3-live.test.cjs tests/v3-preview.test.cjs preview-pedidos/resumo-model.test.cjs
          node v3/build.cjs _site/v3

      - name: Enviar os arquivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
