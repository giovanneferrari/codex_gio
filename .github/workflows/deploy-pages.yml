name: Publicar no GitHub Pages

on:
  push:
    branches: [main, work]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Configurar o GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar os arquivos do site
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY || vars.GOOGLE_MAPS_API_KEY }}
        run: |
          mkdir -p _site
          cp index.html styles.css app.js workshop.html workshop.css workshop-overrides.css workshop.js .nojekyll _site/
          printf "window.RITO_GOOGLE_MAPS_API_KEY='%s';\n" "$GOOGLE_MAPS_API_KEY" > _site/google-maps-config.js
          cp -R assets _site/assets
          cp -R rev2 _site/rev2
          cp -R workshop _site/workshop

      - name: Enviar os arquivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
